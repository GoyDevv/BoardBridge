name: build goyxcomtrol latency patch

on:
  push:
    branches:
      - goyxcomtrol-latency-1-2
    paths:
      - goyxcomtrol/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install sdk packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: reconstruct source bundle
        run: |
          mkdir -p goyxcomtrol/work
          cat goyxcomtrol/_src_b64/*.part | base64 -d > goyxcomtrol/work/source.tar.gz
          tar -xzf goyxcomtrol/work/source.tar.gz -C goyxcomtrol/work
          test -f goyxcomtrol/work/xtg-cloud-pad/build.sh
          test -f goyxcomtrol/work/xtg-cloud-pad/src/com/xtg/pad/PadState.java

      - name: fetch shizuku build jars
        run: |
          mkdir -p goyxcomtrol/work/xtg-cloud-pad/android/libs
          base=https://repo1.maven.org/maven2/dev/rikka/shizuku
          curl -fL --retry 3 "$base/api/13.1.5/api-13.1.5.jar" -o goyxcomtrol/work/xtg-cloud-pad/android/libs/api.jar
          curl -fL --retry 3 "$base/provider/13.1.5/provider-13.1.5.jar" -o goyxcomtrol/work/xtg-cloud-pad/android/libs/provider.jar
          curl -fL --retry 3 "$base/aidl/13.1.5/aidl-13.1.5.jar" -o goyxcomtrol/work/xtg-cloud-pad/android/libs/aidl.jar

      - name: validate javascript
        working-directory: goyxcomtrol/work/xtg-cloud-pad
        run: node --check assets/bridge.js

      - name: build apk
        working-directory: goyxcomtrol/work/xtg-cloud-pad
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          chmod +x build.sh
          ./build.sh
          test -s xtg-cloud-pad-1.2.0.apk

      - name: verify apk
        working-directory: goyxcomtrol/work/xtg-cloud-pad
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose xtg-cloud-pad-1.2.0.apk
          sha256sum xtg-cloud-pad-1.2.0.apk > SHA256SUMS.txt

      - name: stage source and apk
        run: |
          rm -rf goyxcomtrol/source goyxcomtrol/dist
          mkdir -p goyxcomtrol/source goyxcomtrol/dist
          cp -a goyxcomtrol/work/xtg-cloud-pad/. goyxcomtrol/source/
          cp goyxcomtrol/work/xtg-cloud-pad/xtg-cloud-pad-1.2.0.apk goyxcomtrol/dist/
          cp goyxcomtrol/work/xtg-cloud-pad/SHA256SUMS.txt goyxcomtrol/dist/
          cp goyxcomtrol/work/source.tar.gz goyxcomtrol/xtg-cloud-pad-1.2.0-src.tar.gz
          rm -rf goyxcomtrol/source/build goyxcomtrol/source/android/libs
          find goyxcomtrol/source -name '*.apk' -delete
          find goyxcomtrol/source -name '*.keystore' -delete
          rm -rf goyxcomtrol/_src_b64 goyxcomtrol/READY goyxcomtrol/work

      - name: commit generated source and apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A goyxcomtrol
          git commit -m "build goyxcomtrol 1.2.0 latency patch"
          git push origin HEAD:${{ github.ref_name }}

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: goyxcomtrol-1.2.0-apk
          path: goyxcomtrol/dist/xtg-cloud-pad-1.2.0.apk
          if-no-files-found: error
